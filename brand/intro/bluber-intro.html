<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BluBer Games Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Escenario blanco de pantalla completa con el logo al centro y una barra de control discreta abajo */
  :root {
    --paper: #FFFFFF;     /* fondo del logo */
    --navy: #00385B;      /* "BluBer", ojo y nariz */
    --ice: #82CAFD;       /* cuerpo del oso y "GAMES" */
    --sea: #50AFEA;       /* sombras del oso */
    --frost: #B6E3FF;     /* cristales de hielo */
    --ui: #5D7487;        /* texto de los controles */
    --line: #E3EEF6;      /* bordes suaves */
    --f-ui: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--navy); font-family: var(--f-ui); display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
  .stage { display: grid; place-items: center; min-height: 0; padding-inline: 16px; }
  svg.logo { width: min(88vw, 640px); height: auto; max-height: 72vh; overflow: visible; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .controls button { font: 600 13px var(--f-ui); letter-spacing: 0.02em; color: var(--navy); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; transition: border-color .2s, background .2s; }
  .controls button:hover { border-color: var(--ice); }
  .controls button[aria-pressed="true"] { background: var(--navy); color: var(--paper); border-color: var(--navy); }
  .controls button:focus-visible, .scrub input:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
  .scrub { display: flex; align-items: center; gap: 10px; color: var(--ui); font: 500 12px var(--f-ui); font-variant-numeric: tabular-nums; }
  .scrub input { width: min(260px, 52vw); accent-color: var(--sea); }
  .scrub output { min-width: 92px; }
</style>
</head>

        </g>

<nav class="controls" aria-label="Controles de la animación">
  <button type="button" id="replay">Repetir</button>
  <button type="button" id="slow" aria-pressed="false">Cámara lenta</button>
  <label class="scrub" for="scrub"><input type="range" id="scrub" min="0" max="4000" step="10" value="0" aria-label="Momento de la animación"><output id="clock">0.00 s / 4.00 s</output></label>
</nav>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const TOTAL = 4000;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const easeOut = "cubic-bezier(.16,1,.3,1)";        // salida suave tipo "expo"
  const inOut = "cubic-bezier(.65,0,.35,1)";
  let anims = [], slow = false, raf = 0;

  // Copia de las letras para el brillo que las recorre (un clipPath no admite grupos: cada letra lleva su posición)
  const ws = $("#word-shape");
  document.querySelectorAll("#word .ltr").forEach((l) => {
    const c = l.cloneNode(); c.removeAttribute("class"); c.setAttribute("transform", "translate(560 0)"); ws.appendChild(c);
  });

  function tl(el, frames, delay, duration, easing = easeOut) {
    el.style.transformBox = "fill-box";
    const a = el.animate(frames, { delay, duration, easing, fill: "both" });
    anims.push(a);
    return a;
  }

  function build() {
    anims.forEach((a) => a.cancel());
    anims = [];
    // 0 · Acercamiento lento de toda la composición
    tl($("#all"), [{ transform: "scale(0.955)" }, { transform: "scale(1)" }], 0, TOTAL, "cubic-bezier(.22,.6,.2,1)");
    $("#all").style.transformOrigin = "center";

    // 1 · El oso aparece: se desvanece hacia adentro con un acercamiento muy leve, sin rebote
    const bear = $("#bear"); bear.style.transformOrigin = "50% 100%";
    tl(bear, [
      { transform: "translateY(3px) scale(0.965)", opacity: 0 },
      { transform: "translateY(0) scale(1)", opacity: 1 }
    ], 250, 1000, "cubic-bezier(.25,.1,.25,1)");

    // 2 · "BluBer": cada letra sube desde su línea base
    document.querySelectorAll("#word .ltr").forEach((l, i) => {
      tl(l, [{ transform: "translateY(54px)" }, { transform: "translateY(0)" }], 1200 + i * 70, 760, easeOut);
    });

    // 3 · "GAMES" se abre desde el centro
    const gm = [...document.querySelectorAll("#games .gm")];
    const boxes = gm.map((g) => g.getBBox());
    const cx = (boxes[0].x + boxes[4].x + boxes[4].width) / 2;
    gm.forEach((g, i) => {
      const mid = boxes[i].x + boxes[i].width / 2, dx = (cx - mid) * 0.75;
      const order = Math.abs(i - 2);
      tl(g, [{ transform: `translateX(${dx}px)`, opacity: 0 }, { transform: "translateX(0)", opacity: 1 }], 1950 + order * 70, 800, easeOut);
    });

    // 4 · Brillo que recorre "BluBer"
    tl($("#sweep"), [{ transform: "translateX(0) skewX(-18deg)" }, { transform: "translateX(360px) skewX(-18deg)" }], 2800, 900, inOut);

    // 5 · El oso levanta la cabeza un poquito y parpadea
    tl($("#bear"), [
      { transform: "rotate(0deg)" }, { transform: "rotate(-2.6deg)", offset: 0.45 }, { transform: "rotate(-2.6deg)", offset: 0.65 }, { transform: "rotate(0deg)" }
    ], 2700, 1000, inOut).effect.updateTiming({ fill: "none" });
    const eye = $("#b-eye"); eye.style.transformOrigin = "center";
    tl(eye, [{ transform: "scaleY(1)" }, { transform: "scaleY(0.12)", offset: 0.5 }, { transform: "scaleY(1)" }], 3250, 200, "ease-in-out").effect.updateTiming({ fill: "none" });

    anims.forEach((a) => (a.playbackRate = slow ? 0.5 : 1));
  }

  // Reloj y barra de tiempo
  const scrub = $("#scrub"), clock = $("#clock");
  const show = (t) => { clock.textContent = `${(t / 1000).toFixed(2)} s / 4.00 s`; scrub.value = t; };
  function track() {
    cancelAnimationFrame(raf);
    const loop = () => {
      const t = Math.min(TOTAL, anims[0] ? anims[0].currentTime || 0 : 0);
      show(t);
      if (anims[0] && anims[0].playState === "running") raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  }
  function play() { build(); if (reduce) { seek(TOTAL); return; } track(); }
  function seek(t) { anims.forEach((a) => { a.pause(); a.currentTime = t; }); show(t); }

  $("#replay").addEventListener("click", play);
  $("#slow").addEventListener("click", (e) => {
    slow = !slow; e.currentTarget.setAttribute("aria-pressed", String(slow));
    play();
  });
  scrub.addEventListener("input", () => { cancelAnimationFrame(raf); seek(+scrub.value); });

  play();
})();
</script>
</body>
</html>
