<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BluBer Games · Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Figtree:wght@500;600;700&display=block">
<style>
  /* Cada diseño es un <section> del tamaño exacto de Instagram; render.js toma una captura de cada uno. */
  @font-face { font-family: "Nunito"; font-weight: 900; src: url("img/nunito-latin-900-normal.woff2") format("woff2"); }
  @font-face { font-family: "Nunito"; font-weight: 700; src: url("img/nunito-latin-700-normal.woff2") format("woff2"); }
  :root {
    --navy: #00385B; --sea: #50AFEA; --ice: #82CAFD; --snow: #B6E3FF; --frost: #F2F9FF; --ink-2: #3E5F78;
    --night: #1C2535; --night-2: #121927; --text: #EEF1F6; --soft: #A9B6CC;
    --top: #FFC94F; --left: #FF7B63; --right: #6F8EF7;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #777; display: grid; gap: 40px; padding: 40px; justify-content: start; }
  section { position: relative; overflow: hidden; }
  .sq { width: 1080px; height: 1080px; }
  .post { width: 1080px; height: 1350px; }

  /* ---------- Foto de perfil: solo el oso ---------- */
  #profile { background: radial-gradient(circle at 50% 45%, #FFFFFF 0 46%, var(--frost) 72%); display: grid; place-items: center; }
  #profile img { width: 600px; transform: translate(-6px, 10px); }

  /* ---------- Post 1: hola, somos BluBer Games ---------- */
  #p1 { background: #FFFFFF; display: grid; place-items: center; text-align: center; }
  #p1 .ice { position: absolute; inset: auto 0 0 0; height: 300px; background: linear-gradient(180deg, rgba(242,249,255,0) 0, var(--frost) 55%, #E3F2FE 100%); }
  #p1 .wrap { position: relative; display: grid; justify-items: center; gap: 46px; transform: translateY(-40px); }
  #p1 .logo { width: 620px; }
  #p1 h1 { font: 800 70px/1.08 "Montserrat", sans-serif; letter-spacing: -0.03em; color: var(--navy); }
  #p1 h1 span { color: var(--sea); }
  #p1 p { font: 600 34px/1.45 "Figtree", sans-serif; color: var(--ink-2); max-width: 760px; }
  #p1 .url { position: absolute; bottom: 52px; left: 0; right: 0; font: 700 26px "Montserrat", sans-serif; letter-spacing: 0.18em; color: var(--sea); text-transform: uppercase; }

  /* ---------- Post 2: nuestro primer juego ---------- */
  .night { background: radial-gradient(ellipse 70% 55% at 50% 44%, rgba(111,142,247,0.30), rgba(111,142,247,0) 70%), linear-gradient(170deg, #2C3954 0%, var(--night) 45%, var(--night-2) 100%); color: var(--text); }
  .eyebrow { font: 700 26px "Montserrat", sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ice); }
  .wordmark { font: 900 132px/1 "Nunito", sans-serif; letter-spacing: -0.02em; color: var(--text); white-space: nowrap; }
  .wordmark b { font-weight: 900; position: relative; display: inline-block; }
  .wordmark b::after { content: ""; position: absolute; left: 2%; right: 2%; bottom: -26px; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--top) 0 33.3%, var(--left) 33.3% 66.6%, var(--right) 66.6% 100%); }
  .tiles { position: absolute; inset: 0; pointer-events: none; }
  .tile { position: absolute; width: var(--s); height: calc(var(--s) * 0.58); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); border-radius: 8px; }
  .t { background: linear-gradient(160deg, #FFDB7E, #F5B12C); }
  .l { background: linear-gradient(160deg, #FF9884, #EC5F48); }
  .r { background: linear-gradient(160deg, #8FA9FF, #5371E6); }
  .blur { filter: blur(5px); opacity: 0.45; }
  #p2 .center { position: absolute; inset: 0 0 190px 0; display: grid; justify-items: center; align-content: center; gap: 0; text-align: center; }
  #p2 .board { width: 500px; margin: 30px 0 6px; filter: drop-shadow(0 30px 40px rgba(4,7,14,0.55)); }
  #p2 .sub { font: 700 38px/1.3 "Nunito", sans-serif; color: var(--soft); margin-top: 60px; }
  #p2 .badge { margin-top: 36px; display: inline-flex; align-items: center; gap: 14px; padding: 18px 34px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.18); font: 700 28px "Montserrat", sans-serif; letter-spacing: 0.02em; color: var(--text); }
  .badge svg { width: 30px; height: 30px; }
  /* Logo oficial sin modificar sobre una tarjeta blanca (no hay versión oficial para fondo oscuro) */
  .by { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; }
  /* Cuadro con la forma de un ícono de iOS (esquinas continuas tipo "squircle") */
  .by span { width: 104px; height: 104px; display: grid; place-items: center; background: #FFFFFF; box-shadow: 0 10px 26px rgba(3, 6, 12, 0.35);
    -webkit-mask: url("img/ios-squircle.svg") center / 100% 100% no-repeat; mask: url("img/ios-squircle.svg") center / 100% 100% no-repeat; }
  .by .wrap-shadow { filter: drop-shadow(0 10px 22px rgba(3, 6, 12, 0.45)); }
  .by img { display: block; width: 80px; }

  /* ---------- Post 3: cómo se juega ---------- */
  #p3 .copy { position: absolute; top: 96px; left: 0; right: 0; text-align: center; display: grid; gap: 22px; justify-items: center; }
  #p3 h2 { font: 900 84px/1.04 "Nunito", sans-serif; letter-spacing: -0.02em; color: var(--text); }
  #p3 h2 span { color: var(--top); }
  #p3 .phone { position: absolute; left: 50%; top: 380px; width: 540px; transform: translateX(-50%); border-radius: 64px; overflow: hidden; border: 10px solid #2E3A52; box-shadow: 0 40px 80px rgba(3,6,12,0.6); }
  #p3 .phone img { display: block; width: 100%; }
  #p3 .chips { position: absolute; left: 0; right: 0; bottom: 210px; display: flex; justify-content: center; gap: 16px; }
  #p3 .chip { padding: 14px 26px; border-radius: 999px; background: rgba(22,30,46,0.92); border: 2px solid rgba(255,255,255,0.14); font: 700 27px "Nunito", sans-serif; color: var(--text); backdrop-filter: blur(6px); }
  #p3 .chip i { font-style: normal; color: var(--top); margin-right: 8px; }
  #p3 .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 520px; background: linear-gradient(180deg, rgba(18,25,39,0) 0, rgba(18,25,39,0.92) 55%, var(--night-2) 100%); }
</style>
</head>
<body>

<section id="profile" class="sq"><img src="img/bluber-bear.svg" alt=""></section>

<section id="p1" class="post">
  <div class="ice"></div>
  <div class="wrap">
    <img class="logo" src="img/bluber-logo.svg" alt="">
    <h1>We make games<br>for <span>iOS</span>.</h1>
    <p>Calm, beautiful puzzles that are easy to start and hard to put down.</p>
  </div>
  <div class="url">blubergames.com</div>
</section>

<section id="p2" class="post night">
  <div class="tiles">
    <i class="tile t" style="--s:150px; left:60px; top:120px; transform:rotate(-14deg)"></i>
    <i class="tile r blur" style="--s:120px; left:830px; top:90px; transform:rotate(22deg)"></i>
    <i class="tile l" style="--s:110px; left:900px; top:330px; transform:rotate(60deg)"></i>
    <i class="tile r" style="--s:130px; left:70px; top:520px; transform:rotate(58deg)"></i>
    <i class="tile t blur" style="--s:150px; left:900px; top:640px; transform:rotate(-8deg)"></i>
    <i class="tile l blur" style="--s:110px; left:20px; top:1010px; transform:rotate(12deg)"></i>
    <i class="tile r" style="--s:100px; left:930px; top:1120px; transform:rotate(-60deg)"></i>
    <i class="tile t" style="--s:110px; left:70px; top:1190px; transform:rotate(30deg)"></i>
  </div>
  <div class="center">
    <div class="eyebrow">Our first game</div>
    <img class="board" src="img/board.png" alt="">
    <div class="wordmark">Cube <b>Swipe</b></div>
    <div class="sub">A relaxing cube puzzle</div>
    <div class="badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.75-.78-2.88-.76-1.48.02-2.85.86-3.61 2.19-1.54 2.67-.39 6.62 1.11 8.79.73 1.06 1.6 2.25 2.75 2.2 1.1-.04 1.52-.71 2.85-.71 1.33 0 1.7.71 2.87.69 1.19-.02 1.94-1.08 2.66-2.14.84-1.23 1.19-2.42 1.21-2.48-.03-.01-2.32-.89-2.33-3.54ZM14.2 6.13c.61-.74 1.02-1.76.91-2.78-.88.04-1.94.59-2.57 1.32-.56.65-1.06 1.69-.93 2.69.98.08 1.98-.5 2.59-1.23Z"/></svg>Coming soon to the App Store</div>
  </div>
  <div class="by"><div class="wrap-shadow"><span><img src="img/bluber-logo.svg" alt="BluBer Games"></span></div></div>
</section>

<section id="p3" class="post night">
  <div class="tiles">
    <i class="tile l blur" style="--s:140px; left:40px; top:260px; transform:rotate(20deg)"></i>
    <i class="tile t" style="--s:110px; left:900px; top:300px; transform:rotate(-30deg)"></i>
    <i class="tile r" style="--s:120px; left:60px; top:760px; transform:rotate(60deg)"></i>
    <i class="tile t blur" style="--s:150px; left:880px; top:700px; transform:rotate(10deg)"></i>
  </div>
  <div class="copy">
    <div class="eyebrow">How to play</div>
    <h2>Swipe. Turn.<br><span>Rebuild the cube.</span></h2>
  </div>
  <div class="phone"><img src="img/play-hint.png" alt=""></div>
  <div class="fade"></div>
  <div class="chips"><span class="chip"><i>★</i>50 levels</span><span class="chip"><i>♪</i>Relaxing sounds</span><span class="chip"><i>✓</i>No ads</span></div>
  <div class="by"><div class="wrap-shadow"><span><img src="img/bluber-logo.svg" alt="BluBer Games"></span></div></div>
</section>

</body>
</html>
